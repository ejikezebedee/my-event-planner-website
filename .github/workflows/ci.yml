name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Install, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm --filter @mep/api test
      - name: Build
        run: pnpm build

  e2e:
    name: API + browser e2e (PostgreSQL)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mep
          POSTGRES_PASSWORD: mep
          POSTGRES_DB: my_event_planner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mep -d my_event_planner"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mep:mep@localhost:5432/my_event_planner
      REDIS_URL: redis://localhost:6379
      WEB_ORIGIN: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      STORAGE_DRIVER: local
      STORAGE_DIR: /tmp/mep-uploads
      AUTH_REGISTER_RATE_LIMIT: 200
      AUTH_LOGIN_RATE_LIMIT: 200
      API_PORT: 4000
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Migrate + seed
        run: |
          pnpm prisma:generate
          pnpm prisma:migrate
          pnpm seed
      - name: Build
        run: pnpm build
      - name: Start email worker
        run: |
          cd apps/api
          node dist/worker.js > /tmp/worker.log 2>&1 &
          sleep 3
          kill -0 $!
      - name: Start API
        run: |
          cd apps/api
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break || sleep 1; done
      - name: API e2e suites
        run: pnpm --filter @mep/api test:e2e
      - name: Start web
        run: |
          cd apps/web
          node .next/standalone/apps/web/server.js > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 > /dev/null && break || sleep 1; done
        env:
          PORT: 3000
          HOSTNAME: 0.0.0.0
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser e2e suites
        run: pnpm exec playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
