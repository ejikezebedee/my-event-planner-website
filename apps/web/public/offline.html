<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — My Event Planner</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; background: #fafafa; color: #111; }
    .card { text-align: center; max-width: 24rem; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: .5rem; }
    p { color: #666; margin-bottom: 1.5rem; }
    button { background: #7c3aed; color: #fff; border: 0; border-radius: .5rem; padding: .75rem 1.5rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>My Event Planner needs an internet connection for this page. Your data is safe — please reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
